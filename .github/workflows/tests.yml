name: tests

# Runs on synthetic matches only. No match data exists in CI, and none ever should.
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-team.txt
      - run: python -m pytest -q
